# WSL-native FastAPI using uv; Docker only owns OpenVPN and a localhost DB relay.
name: panadan-dev
services:
  vpn:
    image: danf-v2-vpn:latest
    pull_policy: never
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    volumes:
      - ./vpn:/vpn:ro
    ports:
      - '127.0.0.1:${PANADAN_PG_PROXY_PORT:-15432}:15432'
    healthcheck:
      test: ['CMD-SHELL', "ip -4 addr show dev tun0 | grep -q 'inet ' && ip -4 route get 192.168.3.9 | grep -Eq 'dev tun[[:alnum:]_.-]*'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  pgrelay:
    image: danf-v2-python:latest
    pull_policy: never
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    command: [python, -u, /relay/pgrelay.py]
    volumes:
      # Mount the stable directory, not a single Git-replaced file inode.
      # Docker Desktop + WSL can retain a stale source for single-file mounts
      # across git pull; a fresh container will bind the current directory.
      - ./tools:/relay:ro
    environment:
      PANADAN_PG_TARGET: '192.168.3.9'
      PANADAN_PG_TARGET_PORT: '5432'
    restart: unless-stopped
