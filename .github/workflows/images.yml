name: Build private GHCR images
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.web'
      - 'Dockerfile.vpn'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'server/**'
      - 'templates/**'
      - 'static/**'
      - 'package.json'
      - 'web/**'
      - 'start-vpn.sh'
      - '.github/workflows/images.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile.web
          - name: vpn
            dockerfile: Dockerfile.vpn
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/panadan-${{ matrix.name }}:main
            ghcr.io/${{ github.repository_owner }}/panadan-${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
