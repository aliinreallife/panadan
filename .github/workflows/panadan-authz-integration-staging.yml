name: Isolated Panadan real authorization staging

on:
  push:
    paths:
      - 'oauth-staging/panadan-authz-integration/**'
      - '.github/workflows/panadan-authz-integration-staging.yml'
      - 'server/security.py'
      - 'server/oauth_mcp.py'
      - 'server/field_permissions.py'
      - 'server/mcp_tools.py'
      - 'server/main.py'
  pull_request:
    paths:
      - 'oauth-staging/panadan-authz-integration/**'
      - '.github/workflows/panadan-authz-integration-staging.yml'
      - 'server/security.py'
      - 'server/oauth_mcp.py'
      - 'server/field_permissions.py'
      - 'server/mcp_tools.py'
      - 'server/main.py'

permissions:
  contents: read

jobs:
  synthetic-panadan-authz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install isolated security dependencies
        working-directory: oauth-staging/panadan-authz-integration
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Prove exact production security-code provenance
        working-directory: oauth-staging/panadan-authz-integration
        run: python -m pytest -q tests/test_provenance.py
      - name: Signed JWT -> real Panadan permissions -> synthetic MCP -> local revocation
        working-directory: oauth-staging/panadan-authz-integration
        run: python -m pytest -q tests/test_integration.py
      - name: Python syntax check
        run: python -m compileall -q oauth-staging/panadan-authz-integration
