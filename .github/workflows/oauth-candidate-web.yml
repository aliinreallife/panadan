name: Build Panadan WorkOS candidate web image

on:
  push:
    branches:
      - feat/panadan-oauth-existing-login-20261121
      - feat/native-authkit-admin
    paths:
      - '.github/workflows/oauth-candidate-web.yml'
      - 'Dockerfile.web'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'server/**'
      - 'templates/**'
      - 'static/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: panadan-oauth-candidate-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-web:
    if: github.ref == 'refs/heads/feat/panadan-oauth-existing-login-20261121' || github.ref == 'refs/heads/feat/native-authkit-admin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/panadan-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=oauth-candidate-web
      - name: Record candidate artifact
        run: |
          echo "Candidate: ghcr.io/${{ github.repository_owner }}/panadan-web:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow only publishes an image; it does not deploy to production." >> "$GITHUB_STEP_SUMMARY"
