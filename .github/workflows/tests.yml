name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.13.6"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check executable file modes
        run: |
          test -x panadan.sh
          test -x migrate-from-danf.sh
          test -x start-vpn.sh
      - name: Confirm lockfile exists
        run: test -s uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --dev --python 3.13
      - name: Run tests
        run: uv run --locked python -m pytest -q
      - name: Compile sources
        run: uv run --locked python -m compileall -q server tests tools
      - name: Test transcript formatter
        run: node --test tests/*.test.mjs
      - name: Check browser JavaScript syntax
        run: node --check static/app.js && node --check static/phone.js && node --check static/labels.js && node --check static/jalali.js && node --check static/webmcp.js && node --check static/selects.js && node --check static/activity.js
      - name: Compile dashboard assets
        run: npm ci --no-audit --no-fund && npm run build
      - name: Validate shell scripts
        run: bash -n panadan.sh migrate-from-danf.sh


  platform-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: panadan_ci
          POSTGRES_PASSWORD: synthetic_ci_password_only
          POSTGRES_DB: panadan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U panadan_ci -d panadan_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      PANADAN_PLATFORM_TEST_DSN: postgresql://panadan_ci:synthetic_ci_password_only@127.0.0.1:5432/panadan_ci
      PANADAN_PLATFORM_TEST_ALLOW_RESET: "YES"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.13.6"
      - name: Install locked dependencies
        run: uv sync --locked --dev --python 3.13
      - name: PostgreSQL transactional ingestion tests (synthetic only)
        run: uv run --locked python -m pytest -q tests/test_platform_ingest.py

  docker-build:
    # Validate the same production images before merging a major SDK upgrade.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile.web
          - name: vpn
            dockerfile: Dockerfile.vpn
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: panadan-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
