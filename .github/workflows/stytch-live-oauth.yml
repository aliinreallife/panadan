name: Panadan Stytch Live authorization UI
on:
  pull_request:
    paths:
      - "oauth-live/stytch-nextjs/**"
      - ".github/workflows/stytch-live-oauth.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Test and build without production credentials
        working-directory: oauth-live/stytch-nextjs
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
