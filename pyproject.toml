[project]
name = "panadan"
version = "0.8.0"
description = "Private Persian reporting dashboard, REST API and MCP over isolated OpenVPN"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "psycopg[binary]>=3.2,<4",
  "mcp>=2.3,<3",
  "PyJWT[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
