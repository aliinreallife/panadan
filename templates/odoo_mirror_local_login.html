<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>ورود | آینهٔ محلی پانادان</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8f7;color:#192625;font:15px/1.85 Tahoma,Arial,sans-serif;padding:24px}
main{width:min(100%,400px);background:#fff;border:1px solid #e4eae7;border-radius:18px;padding:32px;box-shadow:0 16px 44px #152c2010}
h1{font-size:22px;margin:0 0 8px}p{color:#61706b;margin:0 0 24px}label{display:block;font-weight:600;margin-bottom:16px}
input{display:block;width:100%;margin-top:7px;border:1px solid #d4ded9;border-radius:10px;padding:11px;background:#fff;color:#192625;font:inherit}
button{background:#153a30;color:#fff;border:0;border-radius:10px;padding:12px 18px;width:100%;font:inherit;cursor:pointer}
small{display:block;color:#70847c;margin-top:18px}.err{color:#a32a2a}
</style>
</head>
<body>
<main>
<h1>آینهٔ محلی پانادان</h1>
<p>ورود به محیط آزمایشی داده‌های همگام‌شده</p>
{% if request.query_params.get('error') %}<p class="err">نام کاربری یا رمز نادرست است.</p>{% endif %}
<form method="post" action="/local/login">
  <input type="hidden" name="nonce" value="{{nonce}}">
  <label>نام کاربری<input name="username" dir="ltr" maxlength="80" autocomplete="username" required></label>
  <label>رمز عبور<input name="password" type="password" dir="ltr" autocomplete="current-password" required></label>
  <button type="submit">ورود امن</button>
</form>
<small>فقط برای محیط جداشدهٔ آزمایشگاهی؛ بدون دسترسی عمومی</small>
</main>
</body></html>
