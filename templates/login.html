<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود · Panadan</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-page"><main class="login-card"><div class="brand-mark">D</div><h1>ورود به پانادان</h1><p class="muted">گزارش‌های تماس، یک‌جا و امن.</p><form method="post" action="/login" class="stack"><input type="hidden" name="nonce" value="{{ nonce }}"><label>نام کاربری<input name="username" required autocomplete="username" autofocus placeholder="admin"></label><label>رمز عبور<input name="password" type="password" required autocomplete="current-password" placeholder="••••••••••••"></label>{% if request.query_params.get('error') %}<p class="error">نام کاربری یا رمز عبور نادرست است.</p>{% endif %}<button type="submit" class="primary">ورود به داشبورد</button></form><p class="tiny muted">دسترسی به اطلاعات این سامانه ثبت و محدود می‌شود.</p></main></body></html>
